<!DOCTYPE html>
<html>
<head><title>SOC Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#000;color:#00ff88;font-family:monospace;padding:15px}
.log{border:1px solid #222;background:#111;padding:12px;margin:10px 0;color:white;border-radius:8px}
</style>
</head>
<body>
<h1>LIVE SOC - Hackers Trapped: {{ logs|length }}</h1>
{% for l in logs %}
<div class="log">
[{{ l.time }}] IP: {{ l.ip }}<br>
TYPE: {{ l.type }}<br>
PAYLOAD: {{ l.payload }}
</div>
{% endfor %}
</body>
</html>
